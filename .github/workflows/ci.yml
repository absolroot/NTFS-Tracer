name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy --no-self-update

      - name: Check formatting and build the solution
        run: ./lint.ps1

      - name: Run Rust engine tests
        run: cargo test --locked --manifest-path engine/Cargo.toml

      - name: Run desktop regression tests
        run: |
          foreach ($project in 'GlobalLog', 'HexFields', 'Neighborhood', 'PathResolution', 'TrackerFields') {
            dotnet run --no-build --configuration Release --project "tests/$project"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
