[package]
name = "journal-index"
version = "0.4.2"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
ntfslog = { package = "sootmark-ntfslog", version = "=0.1.0", path = "vendor/sootmark-ntfslog" }
tempfile = { version = "3", default-features = false }
time = { version = "0.3", default-features = false }
